<!doctype html>
<!-- Template: capacitor.config.ts writes www/offline.html from this on every sync, with the start URL filled in.
     Everything is inline: on Android this page is served alone, and nothing else can load while offline. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>You're offline · pockett</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --ink: #fafafa;
        --ink-2: #a3a3a3;
        --line: #262626;
        --primary: #c5ee8a;
        --primary-ink: #0a0a0a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f5f1;
          --surface: #ffffff;
          --ink: #0a0a0a;
          --ink-2: #525252;
          --line: #e5e3dc;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        -webkit-user-select: none;
        user-select: none;
      }
      main { max-width: 340px; text-align: center; }
      .mark { width: 72px; height: 72px; margin: 0 auto 24px; display: block; }
      h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--ink-2); font-size: 15px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-ink);
        font: inherit;
        font-weight: 600;
        min-height: 48px;
        padding: 0 28px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; }
      .status { margin-top: 16px; min-height: 1.5em; font-size: 13px; color: var(--ink-2); }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="3 3 26 26" aria-hidden="true"><defs><radialGradient id="pk-fold" gradientUnits="userSpaceOnUse" cx="16" cy="12.2" r="18" gradientTransform="translate(0 12.2) scale(1 0.62) translate(0 -12.2)"><stop offset="0" stop-color="#4a771d"/><stop offset="0.4" stop-color="#7eaa45"/><stop offset="0.82" stop-color="#c5ee8a"/></radialGradient></defs><rect x="3" y="3" width="26" height="26" rx="6" fill="#c5ee8a"/><path d="M3.5 6.6A6 6 0 0 1 9 3H23A6 6 0 0 1 28.5 6.6L17.64 11.46Q16 12.6 14.36 11.46Z" fill="url(#pk-fold)"/><g fill="none" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 15.4 15 19.5 9.8 23.6"/><path d="M17.4 23.8H22.6"/></g></svg>
      <h1>You're offline</h1>
      <p>pockett needs the internet to load lessons and run your code. Your progress is safe on this phone.</p>
      <button id="retry" type="button">Try again</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      (function () {
        var start = "__START_URL__";
        var button = document.getElementById("retry");
        var status = document.getElementById("status");
        function retry() {
          if (navigator.onLine === false) {
            status.textContent = "Still no connection. Check Wi-Fi or mobile data.";
            return;
          }
          button.disabled = true;
          status.textContent = "Reconnecting…";
          window.location.replace(start);
        }
        button.addEventListener("click", retry);
        // come back by itself the moment the connection returns
        window.addEventListener("online", retry);
      })();
    </script>
  </body>
</html>
